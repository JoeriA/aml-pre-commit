
name: aml_precommit CICD

env:
  PROJECT_NAME: DAPR # set this to your project name
  PYTHON_VERSION: 3.11 # set this to the Python version to use
  PACKAGE_NAME: aml_precommit # set this to the name of Github environment
  AZURE_CLI_VERSION: 2.64.0 # set this to your Azure CLI version
  AML_ENVIRONMENT: aml_precommit # set this to the name of AML environment to create
  RG_NAME: default_resource_group # set this to your Azure resource group name
  WS_NAME: default_workspace # set this to your Azure ML workspace name
  PUBLISH_ON_PYPI: False
  REGISTER_AML_ENV: False

on:
  push:
    branches:
      - develop
      - main
      - release/*

  pull_request:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Needed for publication on PyPI
permissions:
  contents: read # Permissions to read the repository code
  id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
  pages: write

jobs:
  Precommit:
    name: Perform pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies with uv
        run: |        
          python -m pip install --upgrade pip
          python -m pip install uv
          uv sync
      
      - name: Run pre-commit
        run: SKIP=uv-lock uv run pre-commit run --all-files --show-diff-on-failure

