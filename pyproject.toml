[project]
name = "aml_precommit"
version = "0.0.1"
description = "A short description of the package."
authors = [{ name = "Team AA", email = "TEAMAdvancedAnalyticsBCO@rotterdam.nl" }]
requires-python = ">=3.11,<4.0"
readme = "README.md"
dependencies = [
    "poetry-plugin-export (>=1.6.0,<2.0.0)",
    "python-dotenv (>=0.21.1,<0.22.0)",
    "python-fire>=0.1.0",
    "pyyaml (>=6.0.3,<7.0.0)",
]

[dependency-groups]
dev = [
    "pylint==2.13.8",
    "pydocstyle>=6.3.0,<7",
    "tomli>=2.0.1,<3",
    "pre-commit==3.4.0",
]
test = [
    "codecov>=2.1.13,<3",
    "mock>=5.1.0,<6",
    "pytest==7.1.2",
    "pytest-cov>=4.0.0,<5",
    "pytest-mock>=3.15.1,<4",
]
docs = [
    "sphinx>=7.2.6,<8",
    "sphinx-markdown-builder==0.6.6",
    "msal>=1.32.3,<2",
    "azure-devops==7.1.0b4",
]

[tool.uv]
default-groups = [
    "dev",
    "test",
]

[tool.hatch.build.targets.sdist]
include = ["src/aml_precommit"]

[tool.hatch.build.targets.wheel]
include = ["src/aml_precommit"]

[tool.hatch.build.targets.wheel.sources]
"src/aml_precommit" = "aml_precommit"

[project.scripts]
check-aml = "aml_precommit.main:main"

[tool.mypy]
python_version = "3.11"
exclude = [".mypy_cache", ".tox", ".venv", "lib", "notebooks", "tests"]
ignore_missing_imports = true
disallow_any_decorated = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true
warn_redundant_casts = true
strict_equality = true
warn_unused_configs = true

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "lib",
    "notebooks",
    "tests",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.11 (>=)
target-version = "py311"

# Allow fix for all enabled rules
fix = true

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F"]
ignore = []

# Allow fix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
docstring-code-format = true

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-s -p no:warnings -m 'not example'"
log_cli = 1
log_cli_level = "INFO"
log_cli_format = "[pytest][%(asctime)s][%(levelname)s][%(module)s][%(funcName)s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
log_level = "INFO"
markers =[
    "onlylocal: marks tests as slow (deselect with '-m \"not onlylocal\"')",
    "serial",
    "example: example tests that are disabled by default"
]
