exclude:
    (?x)^(
        lib/|
        notebooks/|
        tests/|
        devops_pipelines/|
        docs/
    )

repos:
-  repo: https://github.com/pre-commit/pre-commit-hooks
   rev: "v3.4.0"
   hooks:
   -  id: check-merge-conflict
   -  id: check-yaml

-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.1
    hooks:
    -   id: ruff
        types_or: [ python, pyi, jupyter ]
        args: [--config=./pyproject.toml]
    -   id: ruff-format
        types_or: [ python, pyi, jupyter ]
        args: [--config=./pyproject.toml]
